
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shardex Store</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap');

:root {
    --bg: #08080d;
    --card: #13121b;
    --purple: #8b5cf6;
    --light: #c4aaff;
    --text: #f5f3ff;
    --muted: #9993aa;
    --border: #2b2639;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 20px 7%;
    background: #0d0c13;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font: 800 22px 'Orbitron', sans-serif;
    color: var(--light);
}

.logo span {
    color: white;
}

nav {
    display: flex;
    align-items: center;
    gap: 22px;
}

nav a {
    color: #c8c1d9;
    text-decoration: none;
    font-size: 14px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.cart-open,
.hero-button {
    border: 0;
    border-radius: 9px;
    background: var(--purple);
    color: white;
    padding: 11px 17px;
    font-weight: 600;
}

.hero {
    text-align: center;
    padding: 85px 20px 65px;
    background: radial-gradient(ellipse at top, #29174d, transparent 65%);
}

.hero h1 {
    font: 800 clamp(34px, 6vw, 62px)/1.25 'Orbitron', sans-serif;
    margin-bottom: 18px;
}

.hero h1 span {
    color: var(--light);
}

.hero p {
    max-width: 600px;
    margin: auto;
    color: var(--muted);
    font-size: 14px;
}

.hero-button {
    display: inline-block;
    text-decoration: none;
    margin-top: 28px;
}

.section {
    padding: 45px 7%;
}

.section h2 {
    font: 700 26px 'Orbitron', sans-serif;
    margin-bottom: 10px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 25px;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.category-btn {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: #d5cfe5;
    padding: 10px 17px;
}

.category-btn.active,
.category-btn:hover {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product-card {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    transition: .2s;
}

.product-card:hover {
    border-color: var(--purple);
    transform: translateY(-3px);
}

.product-image {
    width: 100%;
    height: 155px;
    object-fit: contain;
    margin-bottom: 15px;
}

.product-card h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.product-card p {
    min-height: 38px;
    color: var(--muted);
    font-size: 12px;
}

.price {
    margin: 16px 0;
}

.price strong {
    color: var(--light);
    font-size: 20px;
}

.price small {
    display: block;
    color: var(--muted);
}

.buy-btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: var(--purple);
    color: white;
    padding: 11px;
    font-weight: 600;
}

.buy-btn:disabled {
    background: #393344;
    color: #aaa2ba;
    cursor: not-allowed;
}

.empty-products {
    color: var(--muted);
    padding: 20px 0;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 28px 15px;
    border-top: 1px solid var(--border);
    font-size: 13px;
}

/* CART */

.cart-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000b;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.cart-overlay.show {
    display: flex;
}

.cart-box {
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    background: #14121d;
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
}

.cart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.cart-header h2 {
    font: 700 22px 'Orbitron', sans-serif;
}

.close-cart {
    color: white;
    background: transparent;
    border: 0;
    font-size: 27px;
}

.cart-empty {
    text-align: center;
    color: var(--muted);
    padding: 25px 0;
}

.cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}

.cart-item-name {
    font-size: 14px;
    font-weight: 600;
}

.cart-item-price {
    color: var(--muted);
    font-size: 12px;
}

.quantity-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.quantity-controls button {
    background: #302640;
    color: white;
    border: 0;
    border-radius: 5px;
    width: 27px;
    height: 27px;
}

.remove-btn {
    display: block;
    color: #ff8585;
    border: 0;
    background: transparent;
    font-size: 11px;
    margin-top: 5px;
}

.cart-total {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
    font-size: 18px;
    font-weight: 700;
}

.checkout-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #25d366;
    color: #07150b;
    font-weight: 700;
}

@media (max-width: 650px) {
    header {
        padding: 16px 5%;
    }

    .logo {
        font-size: 17px;
    }

    nav a {
        display: none;
    }

    .hero {
        padding: 65px 18px 50px;
    }

    .section {
        padding: 35px 5%;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .product-card {
        padding: 12px;
    }

    .product-image {
        height: 115px;
    }

    .product-card h3 {
        font-size: 13px;
    }

    .product-card p {
        font-size: 11px;
    }

    .price strong {
        font-size: 16px;
    }

    .buy-btn {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">SHARDEX <span>STORE</span></div>

    <nav>
        <a href="#home">Home</a>
        <a href="#store">Store</a>
        <button class="cart-open" onclick="openCart()">
            Cart (<span id="cartCount">0</span>)
        </button>
    </nav>
</header>

<section class="hero" id="home">
    <h1>WELCOME TO<br><span>SHARDEX STORE</span></h1>
    <p>Gaming products, digital items and top-ups in one place.</p>
    <a class="hero-button" href="#store">Explore Store</a>
</section>

<section class="section" id="store">
    <h2>Our Products</h2>
    <p class="subtitle">Select a category and choose your product.</p>

    <div class="categories">
        <button class="category-btn active"
                onclick="filterProducts('all', this)">All</button>

        <button class="category-btn"
                onclick="filterProducts('roblox', this)">Roblox</button>

        <button class="category-btn"
                onclick="filterProducts('freefire', this)">Free Fire</button>

        <button class="category-btn"
                onclick="filterProducts('minecraft', this)">Minecraft</button>
    </div>

    <div class="products" id="products">
        <p class="empty-products">Loading products...</p>
    </div>
</section>

<footer>
    © 2026 Shardex Store. All rights reserved.
</footer>

<!-- CART MODAL -->
<div class="cart-overlay" id="cartOverlay" onclick="overlayClick(event)">
    <div class="cart-box">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="closeCart()">×</button>
        </div>

        <div id="cartItems"></div>

        <div class="cart-total">
            <span>Total</span>
            <span id="cartTotal">0 PKR</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">
            Order on WhatsApp
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
